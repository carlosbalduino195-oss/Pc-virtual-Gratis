### `build.bat`

bat
```
@echo off
setlocal
cd /d "%~dp0"

dotnet --version
if errorlevel 1 (
    echo Instale o SDK .NET 8.
    pause
    exit /b 1
)

dotnet restore VirtualPCPro.csproj
if errorlevel 1 goto erro

dotnet publish VirtualPCPro.csproj ^
  -c Release ^
  -r win-x64 ^
  --self-contained true ^
  -p:PublishSingleFile=true ^
  -p:EnableCompressionInSingleFile=true ^
  -o publish

if errorlevel 1 goto erro

echo Build concluido:
echo %CD%\publish\VirtualPCPro.exe
pause
exit /b 0

:erro
echo Erro durante a compilacao.
pause
exit /b 1
```

### Criar disco virtual de 128 GB

powershell
```
qemu-img create -f qcow2 windows.qcow2 128G
```

### Compilar manualmente

powershell
```
dotnet restore
dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
```
